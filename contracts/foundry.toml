[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../node_modules"]
remappings = [
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
  "forge-std/=../node_modules/forge-std/src/",
]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Deploy.s.sol (card K3) writes deployments/<chainId>.json.
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
bsc_testnet = "${RPC_URL}"

[etherscan]
bsc_testnet = { key = "${BSCSCAN_API_KEY}", chain = 97 }
